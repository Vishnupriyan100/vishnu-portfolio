name: Portfolio update once

on:
  push:
    paths:
      - '.github/workflows/portfolio-update-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update portfolio
        run: |
          echo '' | base64 -d > /tmp/update_portfolio.py
          python3 /tmp/update_portfolio.py

      - name: Clean one-time workflows and commit
        run: |
          rm -f .github/workflows/import-resume.yml
          rm -f .github/workflows/professionalize-portfolio.yml
          rm -f .github/workflows/portfolio-update-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Professionalize portfolio and project showcase"
          git push
